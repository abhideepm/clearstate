<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClearState Icon Preview</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
      padding: 40px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .light-bg { background: #f5f5f5; }
    .dark-bg { background: #1a1a1a; color: #e8e4e1; }
    h1 { font-size: 24px; font-weight: 500; }
    .preview-row {
      display: flex;
      gap: 30px;
      align-items: flex-end;
      flex-wrap: wrap;
      justify-content: center;
    }
    .preview-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .preview-item span {
      font-size: 12px;
      opacity: 0.7;
    }
    .icon-container {
      border-radius: 22.37%;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .toggle-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }
    .light-bg .toggle-btn { background: #1a1a1a; color: white; }
    .dark-bg .toggle-btn { background: #e8e4e1; color: #1a1a1a; }
  </style>
</head>
<body class="dark-bg">
  <button class="toggle-btn" onclick="document.body.classList.toggle('light-bg'); document.body.classList.toggle('dark-bg');">
    Toggle Background
  </button>
  
  <h1>ClearState App Icon</h1>
  
  <div class="preview-row">
    <div class="preview-item">
      <div class="icon-container" style="width: 512px; height: 512px;">
        <img src="clearstate_icon.svg" width="512" height="512" alt="ClearState Icon">
      </div>
      <span>512px (App Store)</span>
    </div>
  </div>
  
  <div class="preview-row">
    <div class="preview-item">
      <div class="icon-container" style="width: 180px; height: 180px;">
        <img src="clearstate_icon.svg" width="180" height="180" alt="ClearState Icon">
      </div>
      <span>180px (iPhone @3x)</span>
    </div>
    
    <div class="preview-item">
      <div class="icon-container" style="width: 120px; height: 120px;">
        <img src="clearstate_icon.svg" width="120" height="120" alt="ClearState Icon">
      </div>
      <span>120px (iPhone @2x)</span>
    </div>
    
    <div class="preview-item">
      <div class="icon-container" style="width: 60px; height: 60px;">
        <img src="clearstate_icon.svg" width="60" height="60" alt="ClearState Icon">
      </div>
      <span>60px (iPhone @1x)</span>
    </div>
    
    <div class="preview-item">
      <div class="icon-container" style="width: 29px; height: 29px;">
        <img src="clearstate_icon.svg" width="29" height="29" alt="ClearState Icon">
      </div>
      <span>29px (Settings)</span>
    </div>
  </div>
</body>
</html>
