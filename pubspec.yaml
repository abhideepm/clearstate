name: clearstate
description: "ClearState - Minimalist abstinence tracker"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.0
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Typography
  google_fonts: ^6.1.0
  
  # Date/Time Formatting
  intl: ^0.18.0
  
  # Animations
  flutter_animate: ^4.3.0

  # Biometric Authentication
  local_auth: ^2.1.6

  # Local Notifications (milestone alerts)
  flutter_local_notifications: ^17.2.0
  timezone: ^0.9.4

  cupertino_icons: ^1.0.8
  path_provider: ^2.1.5
  share_plus: ^12.0.1
  file_picker: ^10.3.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.0
  build_runner: ^2.4.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
